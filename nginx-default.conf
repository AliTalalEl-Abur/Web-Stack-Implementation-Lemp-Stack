# nginx-default.conf
# Archivo de configuración de ejemplo para Nginx en el stack LEMP
# Guardado como registro del paso de configuración

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    server_name _;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Fin de archivo
