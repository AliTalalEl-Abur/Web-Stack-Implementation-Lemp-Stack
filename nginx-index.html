<!-- nginx-index.html
     Archivo de ejemplo para registrar el index.html de Nginx en el stack LEMP
     Guardado como parte del registro de configuración
-->
<!DOCTYPE html>
<html>
<head>
    <title>¡Bienvenido a Nginx en LEMP!</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; background: #f8f8f8; color: #333; text-align: center; margin-top: 10%; }
        h1 { color: #009688; }
        .box { background: #fff; padding: 2em; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: inline-block; }
    </style>
</head>
<body>
    <div class="box">
        <h1>¡Nginx está funcionando correctamente!</h1>
        <p>Este es el archivo <strong>index.html</strong> de ejemplo para el servidor Nginx en tu stack LEMP.</p>
        <p>Ubicación típica: <code>/var/www/html/index.html</code></p>
        <p>Modifica este archivo para personalizar la página de inicio de tu servidor web.</p>
    </div>
</body>
</html>
<!-- Fin de archivo -->
